<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jovem Tech EAD - Plataforma de Cursos Online</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome para ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Google Fonts - Roboto -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
    <!-- CSS Personalizado -->
    <link rel="stylesheet" href="../styles/courses.css">
    <link rel="stylesheet" href="../styles/dashboard.css">

</head>
<body>
    <!-- Cabeçalho -->
    <div class="d-flex">
        <!-- Sidebar -->
        <div class="sidebar" id="sidebar">
          <div class="p-3">
            <img src="../assets/logo.png" alt="Logo JovemTech" class="sidebar-logo">
            <ul class="nav flex-column">
              <li class="nav-item">
                <a class="nav-link" href="./dashboard.html">
                  <i class="fas fa-home"></i> Dashboard
                </a>
              </li>
              <li class="nav-item">
                <a class="nav-link active" href="../pages/courses.html">
                  <i class="fas fa-book"></i> Cursos
                </a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="../pages/perfil.html">
                  <i class="fas fa-user"></i> Perfil
                </a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="../pages/comunity.html">
                  <i class="fas fa-users"></i> Comunidade
                </a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="../index.html" >
                    <i class="fa-solid fa-door-open" style="color: #ffffff;"></i> Sair
                </a>
              </li>
            </ul>
          </div>
        </div>
      </div>

    <!-- Breadcrumb e Filtros -->
    <div class="container mt-3">
        <nav aria-label="breadcrumb">
            
        </nav>

        <!-- Barra de Pesquisa -->
        <div class="search-bar">
            <div class="input-group mb-4">
                <span class="input-group-text bg-white border-end-0">
                    <i class="fas fa-search text-muted"></i>
                </span>
                <input type="text" id="searchInput" class="form-control border-start-0" placeholder="Pesquise seu curso...">
            </div>
        </div>

    <!-- Conteúdo Principal -->
    <main class="container">
        <section class="featured-courses mb-5">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>Todos os Cursos</h2>
            </div>
            
            <div class="row" id="featuredCoursesContainer">
                <!-- Cursos serão inseridos dinamicamente via JavaScript -->
            </div>
        </section>

        <!-- Continue Learning -->
        <section class="continue-learning mb-5">
            <h2 class="mb-4">Continue Estudando</h2>
            <div class="row" id="continueCoursesContainer">
                <!-- Cursos em progresso serão inseridos dinamicamente via JavaScript -->
            </div>
        </section>

        <!-- Categorias -->
        <section class="browse-categories mb-5">
            <h2 class="mb-4">Browse Categories</h2>
            <div class="row">
                <div class="col-md-3 mb-4">
                    <div class="category-card">
                        <div class="icon-container">
                            <i class="fas fa-code"></i>
                        </div>
                        <h3>Programming</h3>
                        <p>1,224 courses</p>
                    </div>
                </div>
                <div class="col-md-3 mb-4">
                    <div class="category-card">
                        <div class="icon-container">
                            <i class="fas fa-chart-line"></i>
                        </div>
                        <h3>Business</h3>
                        <p>845 courses</p>
                    </div>
                </div>
                <div class="col-md-3 mb-4">
                    <div class="category-card">
                        <div class="icon-container">
                            <i class="fas fa-paint-brush"></i>
                        </div>
                        <h3>Design</h3>
                        <p>643 courses</p>
                    </div>
                </div>
                <div class="col-md-3 mb-4">
                    <div class="category-card">
                        <div class="icon-container">
                            <i class="fas fa-robot"></i>
                        </div>
                        <h3>AI & ML</h3>
                        <p>432 courses</p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../javascript/course.js"></script>
</body>
</html>
